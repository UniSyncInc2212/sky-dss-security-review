name: Sky critical economic invariants R1

on:
  push:
    branches:
      - sky-critical-invariants-r1-20260918
  workflow_dispatch:

jobs:
  critical-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run local-fork critical invariant gate
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_RPC="http://127.0.0.1:8545"
          CHAINLOG="0xdA0Ab1e0017DEbCd72Be8599041a2aa3bA7e740F"
          PK="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          ATTACKER="0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
          RAY="1000000000000000000000000000"
          ZERO="0x0000000000000000000000000000000000000000"
          OUT="sky-critical-invariants-r1.txt"
          : > "$OUT"

          pick_rpc() {
            for rpc in "https://ethereum-rpc.publicnode.com" "https://eth.llamarpc.com" "https://rpc.ankr.com/eth"; do
              if curl -fsS --max-time 10 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$rpc" | jq -e '.result' >/dev/null 2>&1; then
                echo "$rpc"
                return 0
              fi
            done
            return 1
          }

          resolve() {
            local key="$1"
            local b32
            b32="$(cast format-bytes32-string "$key")"
            cast call --rpc-url "$LOCAL_RPC" "$CHAINLOG" 'getAddress(bytes32)(address)' "$b32" | tr -d '\r' | awk '{print $1}'
          }

          BREACH=0

          expect_revert() {
            local label="$1"
            shift
            set +e
            local msg
            msg="$(cast send --rpc-url "$LOCAL_RPC" --private-key "$PK" "$@" --json 2>&1)"
            local st=$?
            set -e
            echo "${label}_EXIT=$st" | tee -a "$OUT"
            echo "${label}_RESULT=$msg" | tee -a "$OUT"
            if (( st == 0 )); then
              echo "${label}_UNEXPECTED_SUCCESS=YES" | tee -a "$OUT"
              BREACH=1
            else
              echo "${label}_EXPECTED_REVERT=YES" | tee -a "$OUT"
            fi
          }

          UPSTREAM_RPC="$(pick_rpc)" || { echo "INFRA_FAILURE=NO_READ_ONLY_RPC" | tee -a "$OUT"; exit 2; }

          latest_hex="$(curl -fsS -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$UPSTREAM_RPC" | jq -r '.result')"
          latest=$((16#${latest_hex#0x}))

          echo "MODE=LOCAL_FORK_ONLY" | tee -a "$OUT"
          echo "FORK_BLOCK=$latest" | tee -a "$OUT"
          echo "ATTACKER=$ATTACKER" | tee -a "$OUT"

          anvil --fork-url "$UPSTREAM_RPC" --fork-block-number "$latest" --host 127.0.0.1 --port 8545 >anvil-critical.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if cast block-number --rpc-url "$LOCAL_RPC" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          (( ready == 1 )) || { echo "INFRA_FAILURE=ANVIL_START_FAILED" | tee -a "$OUT"; exit 2; }

          # This Anvil-only method hard-binds all writes to the loopback fork.
          cast rpc --rpc-url "$LOCAL_RPC" anvil_nodeInfo >/dev/null
          echo "LOCAL_ANVIL_VERIFIED=YES" | tee -a "$OUT"

          VAT="$(resolve MCD_VAT)"
          DAI="$(resolve MCD_DAI)"
          DAI_JOIN="$(resolve MCD_JOIN_DAI)"
          DOG="$(resolve MCD_DOG)"

          echo "VAT=$VAT" | tee -a "$OUT"
          echo "DAI=$DAI" | tee -a "$OUT"
          echo "DAI_JOIN=$DAI_JOIN" | tee -a "$OUT"
          echo "DOG=$DOG" | tee -a "$OUT"

          for x in "$VAT" "$DAI" "$DAI_JOIN" "$DOG"; do
            [[ -n "$x" && "$x" != "$ZERO" ]] || { echo "INFRA_FAILURE=CHAINLOG_RESOLUTION" | tee -a "$OUT"; exit 2; }
          done

          VAT_CODE_SHA="$(cast code --rpc-url "$LOCAL_RPC" "$VAT" | sha256sum | awk '{print $1}')"
          DAI_CODE_SHA="$(cast code --rpc-url "$LOCAL_RPC" "$DAI" | sha256sum | awk '{print $1}')"
          echo "VAT_CODE_SHA256=$VAT_CODE_SHA" | tee -a "$OUT"
          echo "DAI_CODE_SHA256=$DAI_CODE_SHA" | tee -a "$OUT"

          # Gate A: unprivileged actor may not cross privileged or consent boundaries.
          ATTACKER_WARD="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'wards(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
          echo "ATTACKER_VAT_WARD=$ATTACKER_WARD" | tee -a "$OUT"
          [[ "$ATTACKER_WARD" == "0" ]] || { echo "INFRA_FAILURE=ATTACKER_ALREADY_PRIVILEGED" | tee -a "$OUT"; exit 2; }

          ILK_ETH_A="$(cast format-bytes32-string ETH-A)"

          BASE_DEBT="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'debt()(uint256)' | awk '{print $1}')"
          BASE_VICE="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'vice()(uint256)' | awk '{print $1}')"
          BASE_INT_DAI="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'dai(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
          BASE_EXT_DAI="$(cast call --rpc-url "$LOCAL_RPC" "$DAI" 'balanceOf(address)(uint256)' "$ATTACKER" | awk '{print $1}')"

          expect_revert VAT_SUCK "$VAT" 'suck(address,address,uint256)' "$ATTACKER" "$ATTACKER" 1
          expect_revert VAT_SLIP "$VAT" 'slip(bytes32,address,int256)' "$ILK_ETH_A" "$ATTACKER" 1
          expect_revert VAT_FOLD "$VAT" 'fold(bytes32,address,int256)' "$ILK_ETH_A" "$ATTACKER" 1
          expect_revert VAT_GRAB "$VAT" 'grab(bytes32,address,address,address,int256,int256)' "$ILK_ETH_A" "$ATTACKER" "$ATTACKER" "$ATTACKER" 0 -1
          expect_revert VAT_MOVE_FOREIGN "$VAT" 'move(address,address,uint256)' "$DAI_JOIN" "$ATTACKER" 1

          POST_NEG_DEBT="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'debt()(uint256)' | awk '{print $1}')"
          POST_NEG_VICE="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'vice()(uint256)' | awk '{print $1}')"
          POST_NEG_INT_DAI="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'dai(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
          POST_NEG_EXT_DAI="$(cast call --rpc-url "$LOCAL_RPC" "$DAI" 'balanceOf(address)(uint256)' "$ATTACKER" | awk '{print $1}')"

          if [[ "$POST_NEG_DEBT" != "$BASE_DEBT" || "$POST_NEG_VICE" != "$BASE_VICE" || "$POST_NEG_INT_DAI" != "$BASE_INT_DAI" || "$POST_NEG_EXT_DAI" != "$BASE_EXT_DAI" ]]; then
            echo "NEGATIVE_CONTROL_STATE_CHANGED=YES" | tee -a "$OUT"
            BREACH=1
          else
            echo "NEGATIVE_CONTROL_STATE_CHANGED=NO" | tee -a "$OUT"
          fi

          # Gate B: choose an active native-ETH collateral join and probe exact debt/value conservation.
          SELECTED_ILK=""
          SELECTED_JOIN=""
          SELECTED_NAME=""

          for suffix in A B C; do
            key="MCD_JOIN_ETH_${suffix}"
            join="$(resolve "$key" || true)"
            [[ -n "$join" && "$join" != "$ZERO" ]] || continue
            ilk_name="ETH-${suffix}"
            ilk="$(cast format-bytes32-string "$ilk_name")"

            set +e
            live="$(cast call --rpc-url "$LOCAL_RPC" "$join" 'live()(uint256)' 2>/dev/null | awk '{print $1}')"
            set -e
            [[ "$live" == "1" ]] || continue

            mapfile -t vals < <(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'ilks(bytes32)(uint256,uint256,uint256,uint256,uint256)' "$ilk" | awk '{print $1}')
            (( ${#vals[@]} >= 5 )) || continue

            art="${vals[0]}"
            rate="${vals[1]}"
            spot="${vals[2]}"
            line="${vals[3]}"
            debt_now="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'debt()(uint256)' | awk '{print $1}')"
            line_global="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'Line()(uint256)' | awk '{print $1}')"

            usable="$(python3 -c 'import sys; art,rate,spot,line,debt,Line=map(int,sys.argv[1:]); print("YES" if rate>0 and spot>0 and line>art*rate and Line>debt else "NO")' "$art" "$rate" "$spot" "$line" "$debt_now" "$line_global")"
            if [[ "$usable" == "YES" ]]; then
              SELECTED_ILK="$ilk"
              SELECTED_JOIN="$join"
              SELECTED_NAME="$ilk_name"
              break
            fi
          done

          if [[ -z "$SELECTED_JOIN" ]]; then
            echo "ECONOMIC_PATH=SKIPPED_NO_ACTIVE_ETH_JOIN_CAPACITY" | tee -a "$OUT"
          else
            echo "ECONOMIC_PATH_ILK=$SELECTED_NAME" | tee -a "$OUT"
            echo "ECONOMIC_PATH_JOIN=$SELECTED_JOIN" | tee -a "$OUT"

            DEPOSIT="$(cast to-wei 1000 ether)"
            cast send --rpc-url "$LOCAL_RPC" --private-key "$PK" --value "$DEPOSIT" "$SELECTED_JOIN" 'join(address)' "$ATTACKER" --json >>"$OUT"

            FREE_GEM="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'gem(bytes32,address)(uint256)' "$SELECTED_ILK" "$ATTACKER" | awk '{print $1}')"
            mapfile -t vals < <(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'ilks(bytes32)(uint256,uint256,uint256,uint256,uint256)' "$SELECTED_ILK" | awk '{print $1}')
            ART="${vals[0]}"
            RATE="${vals[1]}"
            SPOT="${vals[2]}"
            ILK_LINE="${vals[3]}"
            DUST="${vals[4]}"
            DEBT0="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'debt()(uint256)' | awk '{print $1}')"
            LINE_GLOBAL="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'Line()(uint256)' | awk '{print $1}')"
            INT0="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'dai(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
            EXT0="$(cast call --rpc-url "$LOCAL_RPC" "$DAI" 'balanceOf(address)(uint256)' "$ATTACKER" | awk '{print $1}')"

            read MAX_DART TARGET_DART MIN_DART <<<"$(python3 -c 'import sys; ink,Art,rate,spot,line,dust,debt,Line=map(int,sys.argv[1:]); safe=(ink*spot)//rate; ic=max(0,(line-Art*rate)//rate); gc=max(0,(Line-debt)//rate); mx=min(safe,ic,gc); mn=(dust+rate-1)//rate; t=mx//2; t=mn if t<mn else t; t=0 if t>mx else t; print(mx,t,mn)' "$FREE_GEM" "$ART" "$RATE" "$SPOT" "$ILK_LINE" "$DUST" "$DEBT0" "$LINE_GLOBAL")"

            echo "FREE_GEM=$FREE_GEM" | tee -a "$OUT"
            echo "RATE=$RATE" | tee -a "$OUT"
            echo "SPOT=$SPOT" | tee -a "$OUT"
            echo "DUST=$DUST" | tee -a "$OUT"
            echo "MAX_DART=$MAX_DART" | tee -a "$OUT"
            echo "TARGET_DART=$TARGET_DART" | tee -a "$OUT"

            if [[ "$TARGET_DART" == "0" ]]; then
              echo "ECONOMIC_PATH=SKIPPED_INSUFFICIENT_CAPACITY" | tee -a "$OUT"
            else
              OVER_DART="$(python3 -c 'import sys; print(int(sys.argv[1])+1)' "$MAX_DART")"
              expect_revert FROB_OVER_BOUNDARY "$VAT" 'frob(bytes32,address,address,address,int256,int256)' "$SELECTED_ILK" "$ATTACKER" "$ATTACKER" "$ATTACKER" "$FREE_GEM" "$OVER_DART"

              cast send --rpc-url "$LOCAL_RPC" --private-key "$PK" "$VAT" 'frob(bytes32,address,address,address,int256,int256)' "$SELECTED_ILK" "$ATTACKER" "$ATTACKER" "$ATTACKER" "$FREE_GEM" "$TARGET_DART" --json >>"$OUT"

              INT1="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'dai(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
              DEBT1="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'debt()(uint256)' | awk '{print $1}')"

              EXPECTED_RAD="$(python3 -c 'import sys; print(int(sys.argv[1])*int(sys.argv[2]))' "$RATE" "$TARGET_DART")"
              MAX_EXIT="$(python3 -c 'import sys; print((int(sys.argv[2])-int(sys.argv[1]))//int(sys.argv[3]))' "$INT0" "$INT1" "$RAY")"

              DRAW_OK="$(python3 -c 'import sys; d0,d1,i0,i1,e=map(int,sys.argv[1:]); print("YES" if d1-d0==e and i1-i0==e else "NO")' "$DEBT0" "$DEBT1" "$INT0" "$INT1" "$EXPECTED_RAD")"
              echo "EXPECTED_RAD_GAIN=$EXPECTED_RAD" | tee -a "$OUT"
              echo "DRAW_CONSERVATION_OK=$DRAW_OK" | tee -a "$OUT"
              [[ "$DRAW_OK" == "YES" ]] || BREACH=1

              if [[ "$MAX_EXIT" != "0" ]]; then
                TOO_MUCH="$(python3 -c 'import sys; print(int(sys.argv[1])+1)' "$MAX_EXIT")"
                expect_revert DAI_EXIT_OVER_BALANCE "$DAI_JOIN" 'exit(address,uint256)' "$ATTACKER" "$TOO_MUCH"

                cast send --rpc-url "$LOCAL_RPC" --private-key "$PK" "$DAI_JOIN" 'exit(address,uint256)' "$ATTACKER" "$MAX_EXIT" --json >>"$OUT"

                INTF="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'dai(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
                EXTF="$(cast call --rpc-url "$LOCAL_RPC" "$DAI" 'balanceOf(address)(uint256)' "$ATTACKER" | awk '{print $1}')"
                DEBTF="$(cast call --rpc-url "$LOCAL_RPC" "$VAT" 'debt()(uint256)' | awk '{print $1}')"

                FINAL_OK="$(python3 -c 'import sys; i0,inf,e0,ef,d0,df,e,ray=map(int,sys.argv[1:]); eg=ef-e0; ig=inf-i0; print("YES" if eg*ray+ig==e and df-d0==e and 0<=ig<ray else "NO")' "$INT0" "$INTF" "$EXT0" "$EXTF" "$DEBT0" "$DEBTF" "$EXPECTED_RAD" "$RAY")"
                echo "FINAL_CONSERVATION_OK=$FINAL_OK" | tee -a "$OUT"
                echo "FINAL_INTERNAL_DAI=$INTF" | tee -a "$OUT"
                echo "FINAL_EXTERNAL_DAI=$EXTF" | tee -a "$OUT"
                echo "FINAL_DEBT=$DEBTF" | tee -a "$OUT"
                [[ "$FINAL_OK" == "YES" ]] || BREACH=1
              fi
            fi
          fi

          if (( BREACH == 1 )); then
            echo "CRITICAL_INVARIANT_BREACH=YES" | tee -a "$OUT"
            exit 10
          fi

          echo "CRITICAL_INVARIANT_BREACH=NO" | tee -a "$OUT"

      - name: Upload critical invariant record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-critical-invariants-r1
          path: |
            sky-critical-invariants-r1.txt
            anvil-critical.log
          if-no-files-found: ignore
