name: UniSync corrected security accounting

on:
  push:
    branches:
      - unisync/security-result-accounting-r1
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/classify_ds_tests.py'
      - 'UNISYNC_SECURITY_RESULT_ACCOUNTING_R1.md'
      - '.github/workflows/unisync-security-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory expected behavior
        run: |
          set -euo pipefail
          python3 scripts/classify_ds_tests.py src/test | tee unisync-test-inventory.json
          python3 - <<'PY'
          import json
          data=json.load(open("unisync-test-inventory.json"))
          counts=data["counts"]
          print("TOTAL", counts["total"])
          print("EXPECTED_DENY_OR_REVERT", counts["expected_deny_or_revert"])
          print("EXPECTED_ALLOW_OR_INVARIANT", counts["expected_allow_or_invariant"])
          assert counts["total"] > 0
          assert counts["expected_deny_or_revert"] > 0
          PY

  source-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned source tree
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -f src/test/dai.t.sol
          grep -q 'function testFailMintGuyNoAuth' src/test/dai.t.sol
          grep -q 'function testFailReplay' src/test/dai.t.sol
          grep -q 'function testPermit()' src/test/dai.t.sol
          echo "SOURCE_PROOF=PASS"

  legacy-toolchain-diagnostic:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install nix
        uses: cachix/install-nix-action@v31
      - name: Diagnose legacy dapp toolchain
        run: |
          set -o pipefail
          nix-shell --pure --run 'dapp test' 2>&1 | tee unisync-dapp-test.log


  maintained-solidity-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Pin Solidity 0.6.12
        run: |
          set -euo pipefail
          forge --version
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.6.12"
          auto_detect_solc = false
          auto_detect_remappings = false
          optimizer = false
          remappings = [
            "ds-test/=lib/ds-test/src/",
            "ds-token/=lib/ds-token/src/",
            "ds-value/=lib/ds-value/src/",
            "ds-auth/=lib/ds-token/lib/ds-auth/src/",
            "ds-math/=lib/ds-token/lib/ds-math/src/",
            "ds-thing/=lib/ds-value/lib/ds-thing/src/",
            "ds-note/=lib/ds-value/lib/ds-thing/lib/ds-note/src/"
          ]
          EOF
          forge config
      - name: Run legacy expected-deny compatibility suite
        run: |
          set -o pipefail
          mkdir -p .unisync
          forge test --match-path 'test/unisync_dai_legacy_fail_compat.t.sol' --match-contract DaiLegacyFailCompat -vv 2>&1 | tee .unisync/dai-foundry.log
          grep -q 'DaiLegacyFailCompat' .unisync/dai-foundry.log
          grep -q 'testCompatMintGuyNoAuth' .unisync/dai-foundry.log
          grep -q 'testCompatReplay' .unisync/dai-foundry.log
          grep -q '10 passed; 0 failed' .unisync/dai-foundry.log
