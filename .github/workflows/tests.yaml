on:
  push:
    branches:
      - research/layerzero-endpoint-fee-r1
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout bounty lab branch
      uses: actions/checkout@v7

    - name: Checkout pinned LayerZero V2
      run: |
        git clone --recurse-submodules https://github.com/LayerZero-Labs/LayerZero-v2.git layerzero-v2
        cd layerzero-v2
        git checkout 9c741e7f9790639537b1710a203bcdfd73b0b9ac
        git submodule update --init --recursive

    - name: Install workspace dependencies
      run: |
        cd layerzero-v2
        corepack enable
        yarn install --immutable

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Inject local-only PoC
      run: |
        cp poc/layerzero/EndpointV2BalanceRefund.t.sol           layerzero-v2/packages/layerzero-v2/evm/protocol/test/EndpointV2BalanceRefund.t.sol

    - name: Run LayerZero PoC only
      run: |
        cd layerzero-v2/packages/layerzero-v2/evm/protocol
        forge test --match-contract EndpointV2BalanceRefundPoC -vvv
